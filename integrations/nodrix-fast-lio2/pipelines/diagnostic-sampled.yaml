apiVersion: plyctl.dev/v2
kind: Pipeline
metadata:
  name: livox-mid360s-fastlio2
  description: Livox MID-360S to FAST-LIO2 to RViz managed by Plyctl
runtime:
  engine: unified
  mode: realtime
  profile: realtime-low-latency
sessions:
  ros:
    uses: ros2.session
    parameters:
      distro: ${ROS_DISTRO:-jazzy}
      underlays:
      - /opt/ros/${ROS_DISTRO:-jazzy}
      path: ${ROBOT_WS}
      trust: explicit
      environment:
        ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-26}
        ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}
      build:
        mode: never
        symlink_install: true
        timeout_s: 1800
applications:
  livox:
    uses: ros2.launch
    bindings:
      session: ros
    parameters:
      package: livox_ros_driver2
      launch_file: msg_MID360s_launch.py
      arguments:
        rviz_enable: false
      restart_policy: on-failure
      max_restarts: 3
      restart_backoff_s: 2
  fast_lio:
    uses: ros2.launch
    bindings:
      session: ros
    parameters:
      package: fast_lio
      launch_file: mapping.launch.py
      arguments:
        use_sim_time: false
        config_file: ${FASTLIO_CONFIG_FILE:-mid360s_handheld.yaml}
        rviz: false
      requirements_timeout_s: 40
  rviz:
    uses: ros2.rviz
    bindings:
      session: ros
    parameters:
      config: ${ROBOT_WS}/install/fast_lio/share/fast_lio/rviz/fastlio.rviz
      requirements_timeout_s: 60
      allow_clean_exit: true
nodes:
  lidar_health:
    uses: ros2.topic_monitor
    bindings:
      session: ros
    parameters:
      mode: sample
      topic: /livox/lidar
      message_type: livox_ros_driver2/msg/CustomMsg
      preset: sensor_data
      startup_timeout_s: 30
      stale_timeout_s: 1
      minimum_rate_hz: 8
      window_s: 3
      sample_interval_s: 0.5
      rate_failure_grace_s: 2
  imu_health:
    uses: ros2.topic_monitor
    bindings:
      session: ros
    parameters:
      mode: sample
      topic: /livox/imu
      message_type: sensor_msgs/msg/Imu
      preset: sensor_data
      startup_timeout_s: 30
      stale_timeout_s: 0.5
      minimum_rate_hz: 150
      window_s: 3
      sample_interval_s: 0.5
      rate_failure_grace_s: 2
  registered_cloud_health:
    uses: ros2.topic_monitor
    bindings:
      session: ros
    parameters:
      mode: sample
      topic: /cloud_registered
      message_type: sensor_msgs/msg/PointCloud2
      preset: sensor_data
      startup_timeout_s: 60
      stale_timeout_s: 1
      minimum_rate_hz: 8
      window_s: 3
      sample_interval_s: 0.5
      rate_failure_grace_s: 3
fragments: {}
edges:
- from: livox.lidar
  to: fast_lio.lidar
  transport:
    uses: ros2.topic
    parameters:
      topic: /livox/lidar
      message_type: livox_ros_driver2/msg/CustomMsg
- from: livox.imu
  to: fast_lio.imu
  transport:
    uses: ros2.topic
    parameters:
      topic: /livox/imu
      message_type: sensor_msgs/msg/Imu
- from: fast_lio.cloud_registered
  to: rviz.cloud_registered
  transport:
    uses: ros2.topic
    parameters:
      topic: /cloud_registered
      message_type: sensor_msgs/msg/PointCloud2
streams: {}
recording:
  enabled: false
  streams: []
  directory: recordings
security:
  require_signed_plugins: false
  allow_unsigned_local_plugins: true
  native_plugin_allowlist: []
  reject_world_writable_plugins: true
  secret_providers:
  - environment
placement:
  default: local
  nodes: {}
