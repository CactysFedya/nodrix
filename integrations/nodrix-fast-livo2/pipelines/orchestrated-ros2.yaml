apiVersion: nodrix.dev/v2
kind: Pipeline

metadata:
  name: fast-livo2-ros2-orchestrated
  description: Generic ROS 2 orchestration without algorithm-specific Nodrix plugins

runtime:
  engine: unified
  mode: realtime
  profile: realtime-low-latency

sessions:
  ros:
    uses: ros2.session
    parameters:
      distro: ${ROS_DISTRO:-jazzy}
      underlays:
        - /opt/ros/${ROS_DISTRO:-jazzy}
        - ${LIVOX_WS}
      path: ${ROBOT_WS}
      trust: explicit
      build:
        mode: if-needed
        symlink_install: true
        parallel_workers: auto
        timeout_s: 1800

nodes:
  livox:
    uses: ros2.launch
    bindings:
      session: ros
    parameters:
      package: livox_ros_driver2
      launch_file: msg_MID360s_launch.py
      arguments:
        rviz_enable: false
      heartbeat_interval_s: 1.0

  fast_livo2:
    uses: ros2.launch
    bindings:
      session: ros
    parameters:
      package: fast_livo
      launch_file: mapping.launch.py
      arguments:
        rviz: false
      requirements_timeout_s: 30

  lidar_health:
    uses: ros2.topic_monitor
    bindings:
      session: ros
    parameters:
      mode: graph
      topic: /livox/lidar
      message_type: livox_ros_driver2/msg/CustomMsg
      startup_timeout_s: 20

  imu_health:
    uses: ros2.topic_monitor
    bindings:
      session: ros
    parameters:
      mode: graph
      topic: /livox/imu
      message_type: sensor_msgs/msg/Imu
      startup_timeout_s: 20

  registered_cloud_health:
    uses: ros2.topic_monitor
    bindings:
      session: ros
    parameters:
      mode: graph
      topic: /cloud_registered
      message_type: sensor_msgs/msg/PointCloud2
      startup_timeout_s: 40

  rviz:
    uses: ros2.rviz
    bindings:
      session: ros
    parameters:
      config: rviz/fast_livo2.rviz
      requirements_timeout_s: 45

  livox_status:
    uses: core.counter_sink
  fast_livo2_status:
    uses: core.counter_sink
  lidar_health_status:
    uses: core.counter_sink
  imu_health_status:
    uses: core.counter_sink
  cloud_health_status:
    uses: core.counter_sink
  rviz_status:
    uses: core.counter_sink

fragments: {}

edges:
  - from: livox.status
    to: livox_status.input
  - from: fast_livo2.status
    to: fast_livo2_status.input
  - from: lidar_health.status
    to: lidar_health_status.input
  - from: imu_health.status
    to: imu_health_status.input
  - from: registered_cloud_health.status
    to: cloud_health_status.input
  - from: rviz.status
    to: rviz_status.input

links:
  - from: livox.lidar
    to: fast_livo2.lidar
    uses: ros2.topic
    parameters:
      topic: /livox/lidar
      message_type: livox_ros_driver2/msg/CustomMsg
  - from: livox.imu
    to: fast_livo2.imu
    uses: ros2.topic
    parameters:
      topic: /livox/imu
      message_type: sensor_msgs/msg/Imu
  - from: fast_livo2.cloud_registered
    to: rviz.cloud_registered
    uses: ros2.topic
    parameters:
      topic: /cloud_registered
      message_type: sensor_msgs/msg/PointCloud2

streams: {}
recording:
  enabled: false
  streams: []
  directory: recordings
  checkpoint_records: 1024
  durable: true
security:
  require_signed_plugins: false
  allow_unsigned_local_plugins: true
  native_plugin_allowlist: []
  reject_world_writable_plugins: true
  secret_providers:
    - environment
placement:
  default: local
  nodes: {}
