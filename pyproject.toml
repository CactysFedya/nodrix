[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodrix"
version = "1.5.1"
description = "High-performance typed runtime for local and distributed streaming graphs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CactysFedya"}]
maintainers = [{name = "Nodrix contributors"}]
keywords = [
  "streaming",
  "dataflow",
  "graph-runtime",
  "computer-vision",
  "zero-copy",
  "shared-memory",
  "cpp",
  "edge-computing",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
vision = ["numpy>=1.26", "opencv-python>=4.9"]
vision-ncnn = ["numpy>=1.26", "opencv-python>=4.9", "ncnn>=1.0.20260526"]
viewer = ["numpy>=1.26", "opencv-python>=4.9"]
media = ["numpy>=1.26", "opencv-python>=4.9"]
all = ["numpy>=1.26", "opencv-python>=4.9"]
dev = [
  "build>=1.2",
  "cibuildwheel>=3.4.1,<4",
  "pytest>=8.0",
  "ruff>=0.12",
  "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/CactysFedya/nodrix"
Documentation = "https://github.com/CactysFedya/nodrix/tree/main/docs"
Repository = "https://github.com/CactysFedya/nodrix.git"
Issues = "https://github.com/CactysFedya/nodrix/issues"
Changelog = "https://github.com/CactysFedya/nodrix/blob/main/CHANGELOG.md"

[project.scripts]
nodrix = "nodrix.cli:app"
nodrix-viewer = "nodrix.viewer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodrix = [
  "native/CMakeLists.txt",
  "native/include/nodrix/*.hpp",
  "native/src/*.cpp",
  "native/examples/*.cpp",
  "native/tests/*.cpp",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["build", "dist", ".venv", "src/nodrix/native"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
build-verbosity = 1
test-command = "python -c \"import nodrix; print(nodrix.__version__)\" && nodrix --version"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["auto"]
