[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plyctl"
version = "2.3.0b1"
description = "The Pipeline OS for real-time local and distributed systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CactysFedya"}]
maintainers = [{name = "Plyctl contributors"}]
keywords = [
  "streaming",
  "dataflow",
  "graph-runtime",
  "computer-vision",
  "zero-copy",
  "shared-memory",
  "cpp",
  "edge-computing",
  "pipeline-os",
  "realtime",
  "ros2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rich>=13.7",
  "packaging>=24",
]

[project.optional-dependencies]
vision = ["numpy>=1.26", "opencv-python>=4.9"]
vision-ncnn = ["numpy>=1.26", "opencv-python>=4.9", "ncnn>=1.0.20260526"]
viewer = ["numpy>=1.26", "opencv-python>=4.9"]
media = ["numpy>=1.26", "opencv-python>=4.9"]
security = ["cryptography>=43"]
otel = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
all = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "cryptography>=43",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
dev = [
  "build>=1.2",
  "cibuildwheel>=3.4.1,<4",
  "pytest>=8.0",
  "pytest-timeout>=2.4",
  "ruff>=0.12",
  "twine>=6.1,<7",
]
docs = [
  "myst-parser>=4,<5",
  "sphinx>=8,<9",
  "sphinx-copybutton>=0.5,<1",
  "sphinx-rtd-theme>=3,<4",
  "sphinxcontrib-mermaid>=1,<2",
]

[project.urls]
Homepage = "https://github.com/CactysFedya/nodrix"
Documentation = "https://cactysfedya.github.io/nodrix/"
Repository = "https://github.com/CactysFedya/nodrix.git"
Issues = "https://github.com/CactysFedya/nodrix/issues"
Changelog = "https://github.com/CactysFedya/nodrix/blob/main/CHANGELOG.md"

[project.scripts]
plyctl = "plyctl.cli:app"
plyctl-viewer = "nodrix.viewer:main"
nodrix = "nodrix.cli:app"
nodrix-viewer = "nodrix.viewer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodrix = [
  "bin/nodrix-native-runner",
  "bin/nodrix-native-runner.exe",
  "bin/libnodrix_ncnn_detector.so",
  "bin/libnodrix_ncnn_detector.dylib",
  "bin/nodrix_ncnn_detector.dll",
  "native/CMakeLists.txt",
  "native/include/nodrix/*.h",
  "native/include/nodrix/*.hpp",
  "native/src/*.cpp",
  "native/examples/*.cpp",
  "native/tests/*.cpp",
  "native/tests/fake_ncnn/*.h",
  "schemas/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 60
timeout_method = "thread"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["build", "dist", ".venv", "src/nodrix/native"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
build-verbosity = 1
environment = { NODRIX_BUILD_NCNN_PLUGIN = "1", NODRIX_FETCH_NCNN = "1" }
test-command = "python -c \"from pathlib import Path; import subprocess,tempfile,nodrix,plyctl; from nodrix.native_runtime import NativeToolchain; assert plyctl.Message is nodrix.Message; runner=NativeToolchain(Path(tempfile.gettempdir())).ensure_runner(); assert subprocess.run([str(runner),'--version'],check=True,capture_output=True,text=True).stdout.strip() == f'nodrix-native-runner {plyctl.__version__}'; root=Path(nodrix.__file__).resolve().parent/'bin'; assert any(root.glob('*ncnn_detector*')), root\" && plyctl --version && nodrix --version"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["auto"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
