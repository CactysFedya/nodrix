<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plyctl documentation</title>
  <meta name="description" content="Plyctl 2.3 documentation in English and Russian">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 760px; margin: 10vh auto; padding: 0 24px; color: #1f2933; }
    .card { border: 1px solid #d9e2ec; border-radius: 12px; padding: 28px; box-shadow: 0 8px 30px rgba(31,41,51,.08); }
    a { display: inline-block; margin: 10px 12px 0 0; padding: 11px 16px; border-radius: 7px; background: #2f7dff; color: white; text-decoration: none; }
    a.secondary { background: #52606d; }
  </style>
  <script>
    (function () {
      var language = (navigator.language || "en").toLowerCase();
      var target = language.indexOf("ru") === 0 ? "ru/latest/" : "en/latest/";
      window.setTimeout(function () { window.location.replace(target); }, 250);
    })();
  </script>
</head>
<body>
  <main class="card">
    <h1>Plyctl documentation</h1>
    <p>Select a language. The page will also choose automatically from your browser language.</p>
    <a href="en/latest/">English</a>
    <a class="secondary" href="ru/latest/">Русский</a>
  </main>
</body>
</html>
