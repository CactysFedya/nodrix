apiVersion: nodrix.dev/v1
kind: Pipeline
metadata:
  name: quickstart
runtime:
  engine: unified
  mode: offline
nodes:
  source:
    uses: core.synthetic_source
    parameters:
      count: 5
      payload:
        label: demo
  delay:
    uses: core.delay
    parameters:
      milliseconds: 2
  console:
    uses: sink.console
  writer:
    uses: sink.jsonl
    parameters:
      path: messages.jsonl
edges:
  - from: source.output
    to: delay.input
    queue:
      capacity: 2
      policy: block
  - from: delay.output
    to: console.input
  - from: delay.output
    to: writer.input
