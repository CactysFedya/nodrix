[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodrix-example-provider"
version = "1.0.0"
description = "Minimal metadata-first Nodrix Provider API 1 example"
requires-python = ">=3.11"
dependencies = ["nodrix>=2.1,<3"]

[project.entry-points."nodrix.providers"]
"example.echo" = "nodrix_example_provider:provider"

[tool.setuptools.packages.find]
where = ["."]
include = ["nodrix_example_provider"]

[tool.setuptools.package-data]
nodrix_example_provider = ["nodrix-provider.json", "nodrix-provider.sig"]
