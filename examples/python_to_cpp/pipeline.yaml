apiVersion: nodrix.dev/v1
kind: Pipeline
metadata:
  name: python-to-cpp-without-graph-changes
runtime:
  engine: unified
  mode: offline
nodes:
  source:
    uses: ./source.py:ArraySource
    outputs:
      frame: vision.frame
    parameters:
      count: 100
      shape: [360, 640, 3]
  mean:
    uses: ./node.py:FrameMeanNode
    inputs:
      frame: vision.frame
    outputs:
      mean: core.number
  record:
    uses: sink.jsonl
    inputs:
      input: core.any
    parameters:
      path: means.jsonl
edges:
  - from: source.frame
    to: mean.frame
    queue: {capacity: 4, policy: block}
  - from: mean.mean
    to: record.input
    queue: {capacity: 16, policy: block}
