name: Orchestration

on:
  pull_request:
    paths:
      - ".github/workflows/orchestration.yml"
      - "src/nodrix/__init__.py"
      - "src/nodrix/cli.py"
      - "src/nodrix/cli_system*.py"
      - "src/nodrix/registry.py"
      - "src/nodrix/transport_nodes.py"
      - "src/nodrix/system/**"
      - "tests/test_system_*.py"
      - "tests/test_v270_rpi5_mapping_m4.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: System orchestration contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint orchestration surface
        run: |
          ruff check \
            src/nodrix/__init__.py \
            src/nodrix/cli.py \
            src/nodrix/cli_system_commands.py \
            src/nodrix/cli_system_run_orchestration.py \
            src/nodrix/registry.py \
            src/nodrix/transport_nodes.py \
            src/nodrix/system/__init__.py \
            src/nodrix/system/local_backend.py \
            src/nodrix/system/orchestration.py \
            src/nodrix/system/process_backend.py \
            src/nodrix/system/transport.py \
            src/nodrix/system/transport_local_backend.py \
            src/nodrix/system/transport_lowering.py \
            src/nodrix/system/transport_process_backend.py \
            tests/test_system_local_backend_scopes.py \
            tests/test_system_orchestration.py \
            tests/test_system_process_backend.py \
            tests/test_system_run_cli.py \
            tests/test_system_run_multi_local_integration.py \
            tests/test_system_run_process_cli.py \
            tests/test_system_run_transport_cli.py \
            tests/test_system_transport.py \
            tests/test_system_transport_api.py \
            tests/test_system_transport_mixed_e2e.py \
            tests/test_system_transport_process_e2e.py \
            tests/test_system_planning.py \
            tests/test_v270_rpi5_mapping_m4.py

      - name: Run orchestration contract tests
        run: |
          pytest -q \
            tests/test_system_local_backend_scopes.py \
            tests/test_system_orchestration.py \
            tests/test_system_process_backend.py \
            tests/test_system_run_cli.py \
            tests/test_system_run_multi_local_integration.py \
            tests/test_system_run_process_cli.py \
            tests/test_system_run_transport_cli.py \
            tests/test_system_transport.py \
            tests/test_system_transport_api.py \
            tests/test_system_transport_mixed_e2e.py \
            tests/test_system_transport_process_e2e.py \
            tests/test_system_planning.py \
            tests/test_v270_rpi5_mapping_m4.py::test_nested_registered_system_executes_from_workspace_root
