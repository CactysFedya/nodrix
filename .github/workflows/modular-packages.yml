name: Modular Packages

on:
  push:
    branches:
      - main
      - feature/2.2.0-modular-ros2
    paths:
      - "packages/**"
      - "integrations/**"
      - "tests/test_v220_provider_discovery.py"
      - "tests/test_v220_sessions.py"
      - "src/nodrix/cli.py"
      - "src/nodrix/execution_plan.py"
      - "src/nodrix/hybrid_runtime.py"
      - "src/nodrix/manifest.py"
      - "src/nodrix/node.py"
      - "src/nodrix/process_host.py"
      - "src/nodrix/provider*.py"
      - "src/nodrix/session.py"
      - "src/plyctl/**"
      - "tests/test_plyctl_compat.py"
      - "scripts/*modular_ros2*"
      - "scripts/*plyctl_ros2*"
      - ".github/workflows/modular-packages.yml"
  pull_request:
    paths:
      - "packages/**"
      - "integrations/**"
      - "tests/test_v220_provider_discovery.py"
      - "tests/test_v220_sessions.py"
      - "src/nodrix/cli.py"
      - "src/nodrix/execution_plan.py"
      - "src/nodrix/hybrid_runtime.py"
      - "src/nodrix/manifest.py"
      - "src/nodrix/node.py"
      - "src/nodrix/process_host.py"
      - "src/nodrix/provider*.py"
      - "src/nodrix/session.py"
      - "src/plyctl/**"
      - "tests/test_plyctl_compat.py"
      - "scripts/*modular_ros2*"
      - "scripts/*plyctl_ros2*"
      - ".github/workflows/modular-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Core and package workspaces
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e packages/nodrix-spatial --no-deps
          python -m pip install "numpy>=1.26,<3"
          python -m pip install -e packages/nodrix-mapping --no-deps
          python -m pip install -e packages/nodrix-ros2 --no-deps
          python -m pip install -e packages/nodrix-spatial-ros2 --no-deps
          python -m pip install build "twine>=6.1,<7"

      - name: Test Provider API and package contracts
        run: |
          python -m pytest -q \
            tests/test_v210.py \
            tests/test_v220_provider_discovery.py \
            tests/test_v220_sessions.py \
            packages/nodrix-spatial/tests \
            packages/nodrix-mapping/tests \
            packages/nodrix-ros2/tests \
            packages/nodrix-spatial-ros2/tests

      - name: Validate provider discovery and ROS graphs
        env:
          LIVOX_WS: /opt/ros/jazzy
          ROBOT_WS: ${{ github.workspace }}
        run: |
          plyctl provider list
          plyctl provider info nodrix.spatial
          plyctl provider info nodrix.mapping
          plyctl provider info nodrix.ros2
          plyctl provider info nodrix.ros2.spatial
          plyctl validate integrations/nodrix-fast-livo2/pipelines/input.yaml
          plyctl validate integrations/nodrix-fast-livo2/pipelines/generic-topic-smoke.yaml
          plyctl validate integrations/nodrix-fast-livo2/pipelines/orchestrated-ros2.yaml
          template_root="$(mktemp -d)"
          plyctl init "${template_root}/ros2-project" --template ros2
          plyctl validate "${template_root}/ros2-project/pipeline.yaml"

      - name: Build independent distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m build . --outdir dist/plyctl-core
          python -m build packages/nodrix-spatial --outdir dist/plyctl-spatial
          python -m build packages/nodrix-mapping --outdir dist/plyctl-mapping
          python -m build packages/nodrix-ros2 --outdir dist/plyctl-ros2
          python -m build packages/nodrix-spatial-ros2 --outdir dist/plyctl-spatial-ros2
          python -m twine check \
            dist/plyctl-core/* \
            dist/plyctl-spatial/* \
            dist/plyctl-mapping/* \
            dist/plyctl-ros2/* \
            dist/plyctl-spatial-ros2/*

      - name: Upload distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: modular-python-distributions
          path: dist/
          if-no-files-found: error

      - name: Test clean wheel installation
        if: matrix.python-version == '3.12'
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install \
            dist/plyctl-core/*.whl \
            dist/plyctl-spatial/*.whl \
            dist/plyctl-mapping/*.whl \
            dist/plyctl-ros2/*.whl \
            dist/plyctl-spatial-ros2/*.whl
          wheel-smoke/bin/python -c \
            "import nodrix_ros2, plyctl_ros2; assert plyctl_ros2.Ros2Session is nodrix_ros2.Ros2Session"
          wheel-smoke/bin/plyctl provider info nodrix.ros2
          wheel-smoke/bin/plyctl provider info nodrix.ros2.spatial

  ros-jazzy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ros:jazzy-ros-base

    steps:
      - uses: actions/checkout@v6
      - name: Install test workspace
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip python3-pytest
          python3 -m pip install --break-system-packages -e .
          python3 -m pip install --break-system-packages -e packages/nodrix-ros2 --no-deps
      - name: Exercise a real Jazzy publisher/subscriber graph
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -m pytest -q packages/nodrix-ros2/tests/test_ros_jazzy_smoke.py
