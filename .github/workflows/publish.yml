name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - id: version
        name: Verify versions
        run: |
          VERSION=$(python scripts/check_release.py --print-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION" >&2
            exit 1
          fi

  release-gate:
    name: Release tests
    needs: verify-tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install toolchain and Plyctl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ffmpeg g++
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all]"

      - name: Lint and test
        env:
          NODRIX_STRESS: "1"
        run: |
          ruff check src tests scripts setup.py
          pytest -q
          cmake -S src/nodrix/native -B build/native \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure

      - name: Compile and link pinned NCNN provider
        run: |
          cmake -S src/nodrix/native -B build/native-ncnn \
            -DCMAKE_BUILD_TYPE=Release \
            -DNODRIX_BUILD_EXAMPLE_PLUGIN=OFF \
            -DNODRIX_BUILD_TESTS=OFF \
            -DNODRIX_BUILD_NCNN_PLUGIN=ON \
            -DNODRIX_FETCH_NCNN=ON
          cmake --build build/native-ncnn \
            --target nodrix_ncnn_detector --parallel 2
          python scripts/ncnn_smoke.py \
            --plugin build/native-ncnn/libnodrix_ncnn_detector.so \
            --param \
              build/native-ncnn/_deps/ncnn-src/examples/squeezenet_v1.1.param \
            --bin \
              build/native-ncnn/_deps/ncnn-src/examples/squeezenet_v1.1.bin

  build-sdist:
    name: Source distribution
    needs: [verify-tag, release-gate]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build and validate sdist
        run: |
          python -m pip install --upgrade build "twine>=6.1,<7"
          python -m build --sdist
          python -m build --sdist --wheel \
            --outdir dist packages/nodrix-compat
          python -m build --sdist --wheel \
            --outdir dist packages/nodrix-spatial
          python -m build --sdist --wheel \
            --outdir dist packages/nodrix-mapping
          python -m build --sdist --wheel \
            --outdir dist packages/nodrix-ros2
          python -m build --sdist --wheel \
            --outdir dist packages/nodrix-spatial-ros2
          python -m twine check dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  build-wheels:
    name: Wheels on ${{ matrix.os }}
    needs: [verify-tag, build-sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel==3.4.1"

      - uses: actions/download-artifact@v6
        with:
          name: sdist
          path: dist

      - name: Build wheels from canonical sdist
        shell: bash
        run: |
          python -m cibuildwheel \
            --output-dir wheelhouse dist/plyctl-*.tar.gz

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/plyctl/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Show distributions
        run: ls -lah dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: Create GitHub release
    needs: [verify-tag, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Create release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Plyctl ${GITHUB_REF_NAME#v}" \
            --generate-notes
