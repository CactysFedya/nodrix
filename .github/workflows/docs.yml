name: Documentation

on:
  push:
    branches:
      - main
      - feature/2.2.0-modular-ros2
    paths:
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation dependencies
        run: >-
          python -m pip install
          "sphinx>=8,<9"
          "myst-parser>=4,<5"
          "sphinx-copybutton>=0.5.2"
          "sphinx-rtd-theme>=3,<4"
          "sphinxcontrib-mermaid>=1,<2"
      - name: Build English and Russian documentation
        run: |
          rm -rf docs/_build/site
          mkdir -p docs/_build/site/en/latest docs/_build/site/ru/latest
          sphinx-build -W --keep-going -b html docs docs/_build/site/en/latest
          sphinx-build -W --keep-going -b html docs/ru docs/_build/site/ru/latest
          cp docs/_landing/index.html docs/_build/site/index.html
          touch docs/_build/site/.nojekyll
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
