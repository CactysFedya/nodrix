name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "sphinx>=8,<9" \
            "myst-parser>=4,<5" \
            "sphinx-copybutton>=0.5.2" \
            "sphinx-rtd-theme>=3,<4" \
            "sphinxcontrib-mermaid>=1,<2"

      - name: Validate documentation configuration
        run: |
          python -m py_compile docs/conf.py docs/ru/conf.py

      - name: Build English documentation
        run: |
          sphinx-build -W --keep-going -b html docs docs/_build/site/en/latest

      - name: Build Russian documentation
        run: |
          sphinx-build -W --keep-going -b html docs/ru docs/_build/site/ru/latest

      - name: Assemble GitHub Pages site
        run: |
          cp docs/_landing/index.html docs/_build/site/index.html
          touch docs/_build/site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-main
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
