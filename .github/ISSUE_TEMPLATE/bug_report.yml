name: Bug report
description: Report a reproducible Nodrix problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the pipeline manifest, commands, and relevant node code.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nodrix version
      placeholder: Output of `nodrix --version`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, architecture, CPU/GPU/NPU, FFmpeg, and installation method.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and run artifacts
      description: Remove tokens and secrets before attaching files.
