[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plyctl-spatial-ros2"
version = "0.1.0"
description = "Typed copy-minimizing bridges between ROS 2 and Plyctl Spatial"
requires-python = ">=3.11"
dependencies = [
  "plyctl>=2.2.0a5,<3",
  "plyctl-spatial>=0.1,<0.2",
  "plyctl-ros2>=0.3,<0.5",
]
readme = "README.md"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."nodrix.providers"]
"nodrix.ros2.spatial" = "nodrix_spatial_ros2.provider:provider"

[project.entry-points."plyctl.providers"]
"nodrix.ros2.spatial" = "nodrix_spatial_ros2.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodrix_spatial_ros2 = ["nodrix-provider.json", "py.typed"]
