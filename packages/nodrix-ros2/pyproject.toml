[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plyctl-ros2"
version = "0.4.0"
description = "Universal ROS 2 orchestration and transport provider for Plyctl"
requires-python = ">=3.11"
dependencies = ["plyctl>=2.2.0a5,<3"]
readme = "README.md"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = ["pytest>=8"]
spatial = ["plyctl-spatial-ros2>=0.1,<0.2"]

[project.entry-points."nodrix.providers"]
"nodrix.ros2" = "nodrix_ros2.provider:provider"

[project.entry-points."plyctl.providers"]
"nodrix.ros2" = "nodrix_ros2.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodrix_ros2 = [
  "nodrix-provider.json",
  "py.typed",
  "templates/ros2/*",
  "templates/ros2/.env.example",
  "templates/ros2-fast-livo2/*",
  "templates/ros2-fast-livo2/.env.example",
  "templates/ros2-fast-livo2/rviz/*.rviz",
]
