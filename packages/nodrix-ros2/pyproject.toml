[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodrix-ros2"
version = "0.1.0"
description = "External ROS 2 Provider API 1 integration for Nodrix"
requires-python = ">=3.11"
dependencies = ["nodrix>=2.1,<3", "nodrix-mapping>=0.1,<0.2"]
readme = "README.md"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
mapping = ["nodrix-mapping>=0.1,<0.2"]
test = ["pytest>=8", "nodrix-mapping>=0.1,<0.2"]

[project.entry-points."nodrix.providers"]
"nodrix.ros2" = "nodrix_ros2.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodrix_ros2 = ["nodrix-provider.json", "py.typed"]
