[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodrix-mapping"
version = "0.1.1"
description = "Mapping contracts and compatibility aliases for Nodrix"
requires-python = ">=3.11"
dependencies = ["nodrix>=2.1,<3", "nodrix-spatial>=0.1,<0.2"]
readme = "README.md"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."nodrix.providers"]
"nodrix.mapping" = "nodrix_mapping.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodrix_mapping = ["nodrix-provider.json", "py.typed"]
