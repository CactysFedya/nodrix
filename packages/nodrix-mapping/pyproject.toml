[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plyctl-mapping"
version = "0.1.1"
description = "Mapping contracts and compatibility aliases for Plyctl"
requires-python = ">=3.11"
dependencies = ["plyctl>=2.2.0a5,<3", "plyctl-spatial>=0.1,<0.2"]
readme = "README.md"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."nodrix.providers"]
"nodrix.mapping" = "nodrix_mapping.provider:provider"

[project.entry-points."plyctl.providers"]
"nodrix.mapping" = "nodrix_mapping.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodrix_mapping = ["nodrix-provider.json", "py.typed"]
